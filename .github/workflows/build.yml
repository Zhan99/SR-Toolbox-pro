        with:
          name: SR-Smart-Toolbox-Pro-build-errors
          path: ${{ env.PROJECT_DIR }}/build-debug.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK was created
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-Smart-Toolbox-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
