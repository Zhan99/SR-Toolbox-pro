name: Build SR Turbo Browser APK
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle && -f app/build.gradle ]]; then
            root="$PWD"
          else
            mapfile -t candidates < <(find . -maxdepth 4 -type f -name settings.gradle -not -path './.git/*' | sort)
            if [[ ${#candidates[@]} -eq 0 ]]; then
              mapfile -t zips < <(find . -maxdepth 2 -type f -iname 'SR-Turbo-Browser*.zip' | sort)
              if [[ ${#zips[@]} -ne 1 ]]; then echo 'Upload one SR-Turbo-Browser source ZIP or the extracted project.'; exit 1; fi
              mkdir -p "$RUNNER_TEMP/sr-browser-source"
              unzip -q "${zips[0]}" -d "$RUNNER_TEMP/sr-browser-source"
              mapfile -t candidates < <(find "$RUNNER_TEMP/sr-browser-source" -maxdepth 4 -type f -name settings.gradle | sort)
            fi
            if [[ ${#candidates[@]} -ne 1 ]]; then echo 'Expected exactly one Android project.'; exit 1; fi
            root=$(realpath "$(dirname "${candidates[0]}")")
          fi
          test -f "$root/app/build.gradle"
          test -f "$root/app/src/main/AndroidManifest.xml"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (no obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK not found at $sdk_root"
            exit 1
          fi
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager=$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -executable | sort -V | tail -n 1)
          fi
          if [[ ! -x "$manager" ]]; then
            echo '::error::Android SDK command-line tools are missing on the runner.'
            exit 1
          fi
          export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$(dirname "$manager")" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          # Ignore only yes's expected SIGPIPE, not sdkmanager's exit status.
          (set +o pipefail; yes | "$manager" --sdk_root="$sdk_root" --licenses >/dev/null)
          packages=()
          [[ -f "$sdk_root/platforms/android-35/android.jar" ]] || packages+=('platforms;android-35')
          [[ -x "$sdk_root/build-tools/34.0.0/aapt2" && -x "$sdk_root/build-tools/34.0.0/apksigner" ]] || packages+=('build-tools;34.0.0')
          [[ -x "$sdk_root/platform-tools/adb" ]] || packages+=('platform-tools')
          if (( ${#packages[@]} )); then
            "$manager" --sdk_root="$sdk_root" "${packages[@]}"
          fi
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/34.0.0/aapt2"
          test -x "$sdk_root/build-tools/34.0.0/apksigner"
          test -x "$sdk_root/platform-tools/adb"
          "$manager" --sdk_root="$sdk_root" --version
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test download engine
        working-directory: ${{ steps.project.outputs.root }}
        run: bash tests/run.sh
      - name: Verify and bundle official video engine
        working-directory: ${{ steps.project.outputs.root }}
        run: bash scripts/prepare-video-engine.sh
      - name: Compile all Android Java sources
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sr-build-logs"
          gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac 2>&1 | tee "$RUNNER_TEMP/sr-build-logs/compile.log"
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sr-build-logs"
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/sr-build-logs/build.log"
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SR-Turbo-Browser-Build-Logs
          path: ${{ runner.temp }}/sr-build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sr-apk"
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/sr-apk/SR-Turbo-Browser.apk"
          unzip -p "$RUNNER_TEMP/sr-apk/SR-Turbo-Browser.apk" assets/sr-yt-dlp | sha256sum | grep -q "^e8665ed64d6b9172773e812f891fb707a0cb1ee8d9ef4fc1acb00cabee4c5256 "
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$RUNNER_TEMP/sr-apk/SR-Turbo-Browser.apk"
          (cd "$RUNNER_TEMP/sr-apk" && sha256sum SR-Turbo-Browser.apk > SHA256SUMS.txt)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-Turbo-Browser-APK
          path: ${{ runner.temp }}/sr-apk/
          if-no-files-found: error
          retention-days: 30
