      # :app:checkDebugDuplicateClasses once caught an AndroidX/Google transitive
      # conflict: kotlin-stdlib 1.8.22 + obsolete kotlin-stdlib-jdk7/jdk8 1.6.21.
      # Inspect the *resolved* runtime graph so this regression is caught early.
      - name: Guard resolved Kotlin runtime classpath (no duplicate JDK jars)
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build
          gradle --no-daemon --console=plain :app:dependencies --configuration debugRuntimeClasspath \
            > build/kotlin-runtime-classpath.txt
          echo '=== Resolved Kotlin runtime dependencies ==='
          grep -F 'org.jetbrains.kotlin:kotlin-' build/kotlin-runtime-classpath.txt || true
          if grep -Eq 'org[.]jetbrains[.]kotlin:kotlin-stdlib-jdk(7|8)(:|[[:space:]]|$)' build/kotlin-runtime-classpath.txt; then
            echo '::error title=Kotlin duplicate classes::Obsolete kotlin-stdlib-jdk7/jdk8 detected. Keep only unified kotlin-stdlib 1.8+.'
            exit 1
          fi
          if ! grep -Eq 'org[.]jetbrains[.]kotlin:kotlin-stdlib:1[.]8[.]22' build/kotlin-runtime-classpath.txt; then
            echo '::error title=Kotlin classpath::Expected kotlin-stdlib 1.8.22 or newer was not requested.'
            exit 1
          fi
          echo 'PASS: Legacy Kotlin JDK7/JDK8 artifacts absent from debug runtime classpath.'

